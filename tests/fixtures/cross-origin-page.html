<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Springfield College — Admissions (cross-origin embed fixture)</title>
  <style>
    body { font-family: Georgia, serif; margin: 0; color: #222; }
    header { background: #1d3a6b; color: #fff; padding: 1rem 2rem; }
    main { max-width: 46rem; margin: 0 auto; padding: 1rem 2rem 4rem; }
  </style>
</head>
<body>
  <!--
    Served from a DIFFERENT origin (e.g. http://localhost:4999) than the
    chatbot (http://127.0.0.1:3000) to exercise the widget exactly as a
    college WordPress site would: cross-origin loader script and iframe,
    visitor credential confined to chatbot-origin session storage.
  -->
  <header><h1>Springfield College</h1></header>
  <main>
    <h2>Admissions</h2>
    <p>Springfield College welcomes applications for the coming academic year.</p>
  </main>
  <script src="http://127.0.0.1:3000/widget/v1.js" defer></script>
</body>
</html>
